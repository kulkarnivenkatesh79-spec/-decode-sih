services:
  - type: web
    name: arogya-dashboard-api
    runtime: node
    plan: starter          # always-on, no cold starts. Change to "free" only for
                            # non-critical testing -- spins down after 15 min idle.
    buildCommand: "npm install"
    startCommand: "node index.js"
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false        # set manually in dashboard -- don't commit secrets here
      - key: MONGO_DB_NAME
        value: sih
      - key: N8N_INTERNAL_AUTH_HEADER_NAME
        sync: false
      - key: N8N_INTERNAL_AUTH_HEADER_VALUE
        sync: false
      - key: DASHBOARD_API_AUTH_HEADER_NAME
        sync: false
      - key: DASHBOARD_API_AUTH_HEADER_VALUE
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: N8N_ESCALATION_MANAGER_BASE_URL
        sync: false        # needed by POST /api/escalations/:case_id/respond
